name: Indenter

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  indent-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Make script executable and run it
        run: |
          chmod +x ./format.sh
          ./format.sh

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          original_message="$(git log -1 --format=%s)"
          git diff-index --quiet HEAD || git commit -m "Indentation run ${{ github.run_number }} >>> ${original_message}"
          git push
