name: ESLint Linter

on:
  push:
  pull_request:

jobs:
  eslint:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install ESLint
        run: npm install --no-save eslint

      - name: Run ESLint
        run: npx eslint .
