name: Linter

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  eslint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install ESLint
        run: npm install --no-save eslint

      - name: Run ESLint autofix
        run: npx eslint . --fix

      - name: Commit ESLint fixes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          original_message="$(git log -1 --format=%s)"
          git diff-index --quiet HEAD || git commit -m "ESLint run ${{ github.run_number }} >>> ${original_message}"
          git push
