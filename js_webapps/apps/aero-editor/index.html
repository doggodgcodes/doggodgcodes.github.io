<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>html editor aero - doggodgcodes</title>
    <style>
      /* The Mega Background */
      body {
        margin: 0;
        background-color: #4276c7;
        /* This is your specific URL! */
        background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT24ZddUcXOopNnnVhUZXw1FIEZjcWy3Z7fEA');

        /* The "Not Weird" Stretch Settings */
        background-size: cover; /* Stretches to fill without squishing! */
        background-position: center; /* Keeps the middle in view */
        background-attachment: fixed; /* Stays still while you scroll */

        height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: 'Segoe UI', sans-serif;
      }

      .editor-container {
        display: flex;
        flex: 1;
        gap: 12px;
        padding: 12px;
        box-sizing: border-box;
      }

      /* Frosted glass wrapper for Monaco */
      .editor-wrapper {
        flex: 1;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px 0 rgba(0,0,0,0.37);
        border: 1px solid rgba(255,255,255,0.15);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Monaco editor container must fill the wrapper */
      #monaco-editor {
        width: 100%;
        height: 100%;
      }

      /* The Output Box (Also a bit glassy!) */
      .output-box {
        flex: 1;
        border-radius: 20px;
        padding: 12px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.9);
        background: rgba(255,255,255,0.85);
        display: flex;
        flex-direction: column;
      }

      .preview-iframe {
        flex: 1;
        width: 100%;
        border-radius: 12px;
        border: 0;
        background: white;
      }

      .world-bar {
        display: flex;
        justify-content: space-between; /* Pushes title left, controls right */
        align-items: center;
        color: white;
        min-height: 48px;
        text-shadow: 0 0 10px rgba(0,0,0,0.5);
        background: rgba(0,0,0,0.2);
        margin: 0;
        padding: 12px;
      }

      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #saveBtn {
        background: rgba(0, 242, 255, 0.6);
        color: white;
        border: 2px solid white;
        padding: 8px 18px;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
      }
      #saveBtn:hover { transform: scale(1.05); }

      label.switch {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255,255,255,0.08);
        padding: 6px 10px;
        border-radius: 20px;
      }

      /* small responsive tweaks */
      @media (max-width: 900px) {
        .editor-container { flex-direction: column; }
        .editor-wrapper, .output-box { height: 45vh; }
      }
    </style>
  </head>
  <body>

    <!-- External libraries: DOMPurify, js-beautify, Monaco loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" integrity="sha512-+Kqbt7BxoT20OXHT6OYj0KpETulwb2UXMJQTdvzJspYi6vE2SsbsTsOB91E93l3AVz8Y41/2bZUhKDQa/lAZgA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/2.0.3/beautify-html.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://unpkg.com/monaco-editor@0.39.0/min/vs/loader.js"></script>

          <div class="world-bar">
          <div>🌊 html editor aero - world bar 🌊 - <strong id="title"></strong></div>
          <div class="controls">
          <label class="switch" title="Run scripts in preview (unsafe)">
            <input type="checkbox" id="runScripts" />
            <span>Run scripts</span>
            </label>
            <button id="saveBtn">save code</button>
            </div>
            </div>

            <div class="editor-container">
            <div class="editor-wrapper">
            <div id="monaco-editor" role="application" aria-label="Code editor (Monaco)">
            <!doctype html>
            <html>
              <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width,initial-scale=1">
                <title>My Webpage</title>
                <style>
                  body {
                    font-family: "Segoe UI", sans-serif;
                  }
                </style>
              </head>
              <body>
                <script src="https://doggodgcodes.github.io/js_webapps/apps/aero-editor/extra-doggodgcodes.js"></script><!-- Ensures where it was made. -->
                </body>
              </html>
              </div>
              </div>

              <div class="output-box">
              <iframe class="preview-iframe" id="previewIframe" sandbox="allow-scripts" title="preview"></iframe>
                </div>
                </div>

                <script>
                  (function () {
                    // Elements
                    const titleEl = document.getElementById('title');
                    const runScriptsCheckbox = document.getElementById('runScripts');
                    const saveBtn = document.getElementById('saveBtn');
                    const iframe = document.getElementById('previewIframe');

                    const initialContent = (function () {
                      const el = document.getElementById('initial-content');
                      return el ? el.textContent.trim() : '<!doctype html><html><head><title>My Webpage</title></head><body></body></html>';
                    })();

                    // Monaco loader setup
                    require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.39.0/min/vs' } });
                    let editor = null;

                    require(['vs/editor/editor.main'], function () {
                      editor = monaco.editor.create(document.getElementById('monaco-editor'), {
                        value: initialContent,
                        language: 'html',
                        theme: 'vs-dark',
                        automaticLayout: true,
                        tabSize: 2,
                        insertSpaces: true,
                        detectIndentation: false, // prevents workflow auto-indent from messing with existing indentation
                        formatOnType: false,
                        formatOnPaste: false,
                        minimap: { enabled: false }
                      });

                      // initialize preview and title
                      updatePreview();
                      updateTitleFromHtml(editor.getValue());

                      // realtime updates (debounced)
                      let timeout = null;
                      editor.onDidChangeModelContent(() => {
                        clearTimeout(timeout);
                        timeout = setTimeout(() => {
                          updatePreview();
                          updateTitleFromHtml(editor.getValue());
                        }, 250);
                      });
                    });

                    function updateTitleFromHtml(html) {
                      const match = html.match(/<title>(.*?)<\/title>/i);
                      if (match && match[1]) {
                        titleEl.textContent = ' ' + match[1];
                        document.title = match[1] + ' - doggodgcodes';
                      }
                    }

                    function updatePreview() {
                      const html = editor ? editor.getValue() : initialContent;

                      if (!runScriptsCheckbox.checked) {
                        // sanitize and set srcdoc so scripts won't run
                        if (window.DOMPurify && typeof DOMPurify.sanitize === 'function') {
                          iframe.srcdoc = DOMPurify.sanitize(html);
                        } else {
                          // fallback: escape HTML and put into a pre block so user sees code
                          iframe.srcdoc = '<pre>' + escapeHtml(html) + '</pre>';
                        }
                        // keep iframe sandboxed without scripts if possible
                        iframe.setAttribute('sandbox', '');
                      } else {
                        // user opted-in to run scripts in preview. Keep sandbox but allow scripts.
                        // Warning: running untrusted scripts can be unsafe. We allow scripts but not same-origin.
                        iframe.setAttribute('sandbox', 'allow-scripts');
                        iframe.srcdoc = html;
                      }
                    }

                    function escapeHtml(str) {
                      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    }

                    saveBtn.addEventListener('click', () => {
                      const content = editor ? editor.getValue() : initialContent;
                      const fileNamePrompt = prompt('What you gonna call it?', 'my_webpage');
                      if (!fileNamePrompt) return;
                      let fileName = fileNamePrompt.endsWith('.html') ? fileNamePrompt : fileNamePrompt + '.html';

                      let userCode = (typeof html_beautify === 'function') ? html_beautify(content) : content;

                      // ensure marker script present
                      if (!userCode.includes('extra-doggodgcodes.js')) {
                        userCode = userCode.replace(/<\/body>/i, '<script src="https://doggodgcodes.github.io/js_webapps/apps/aero-editor/extra-doggodgcodes.js"></' + 'script>\n</body>');
                      }

                      const blob = new Blob([userCode], { type: 'text/html' });
                      const link = document.createElement('a');
                      link.href = URL.createObjectURL(blob);
                      link.download = fileName;
                      document.body.appendChild(link);
                      link.click();
                      setTimeout(() => {
                        URL.revokeObjectURL(link.href);
                        if (link.parentNode) link.parentNode.removeChild(link);
                      }, 200);
                    });

                    // expose updatePreview for manual testing
                    window.aeroUpdatePreview = updatePreview;
                  })();
                </script>
              </body>
            </html>
